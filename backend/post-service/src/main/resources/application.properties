quarkus.http.port=8082
quarkus.application.name=post-service

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${POST_DATASOURCE_URL:jdbc:mysql://localhost:3306/post_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
quarkus.datasource.username=${POST_DATASOURCE_USERNAME:root}
quarkus.datasource.password=${POST_DATASOURCE_PASSWORD:123456}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.swagger-ui.always-include=true

app.upload.dir=uploads

# JSON body size (base64 image co the lon)
quarkus.http.limits.max-body-size=15M

# CORS - cho phep Frontend goi truc tiep
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3002,http://localhost:3000,http://127.0.0.1:3002,http://127.0.0.1:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type
