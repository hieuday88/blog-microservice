quarkus.http.port=8080
quarkus.application.name=api-gateway

services.auth.url=${AUTH_SERVICE_URL:http://127.0.0.1:8081}
services.post.url=${POST_SERVICE_URL:http://127.0.0.1:8082}
services.comment.url=${COMMENT_SERVICE_URL:http://127.0.0.1:8083}

app.jwt-secret=${JWT_SECRET:DayLaKhoaBiMatCuaNhom8RatDaiVaKhoDoanDeBaoMatToken1234567890}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
