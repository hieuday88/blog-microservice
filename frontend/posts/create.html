<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo bài viết | Blog Microservice</title>
    <meta name="description" content="Tạo bài viết mới.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages/post.css">
  </head>
  <body data-mode="create">
    <header id="app-header" class="header"></header>
    <main class="page container post-form-layout">
      <aside class="panel panel-pad">
        <span class="eyebrow">Tạo bài viết</span>
        <h1 class="section-title" style="margin-top: 16px;">Viết bài mới</h1>
        <p class="muted">Biểu mẫu gửi tiêu đề, mô tả, nội dung, mã tác giả, tên tác giả và imageBase64 tới dịch vụ bài viết.</p>
      </aside>
      <section class="panel panel-pad">
        <form id="post-form" class="form-grid">
          <label class="field">Tiêu đề
            <input id="title" class="input" name="title" required>
          </label>
          <label class="field">Mô tả
            <input id="description" class="input" name="description" required>
          </label>
          <label class="field">Nội dung
            <textarea id="content" class="textarea" name="content" required></textarea>
          </label>
          <label class="file-drop">
            <span id="image-label">Chọn ảnh bài viết</span>
            <input id="image" class="hidden" type="file" accept="image/*">
          </label>
          <div id="image-preview" class="preview hidden"></div>
          <p id="post-form-message" class="hidden"></p>
          <button id="post-submit" class="btn" type="submit">Đăng bài</button>
        </form>
      </section>
    </main>
    <footer id="app-footer" class="footer"></footer>
    <script type="module" src="/js/pages/post-form.js"></script>
  </body>
</html>
