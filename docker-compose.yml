version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: blog-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blog-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/auth_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    depends_on:
      - mysql-db
    networks:
      - blog-network

  post-service:
    build: ./post-service
    container_name: post-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/post_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    depends_on:
      - mysql-db
    networks:
      - blog-network

  comment-service:
    build: ./comment-service
    container_name: comment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/comment_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    depends_on:
      - mysql-db
    networks:
      - blog-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - POST_SERVICE_URL=http://post-service:8082
      - COMMENT_SERVICE_URL=http://comment-service:8083
    depends_on:
      - auth-service
      - post-service
      - comment-service
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge

volumes:
  mysql_data: