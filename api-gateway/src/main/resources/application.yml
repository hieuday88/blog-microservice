server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            #1
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**, /api/users/**

           #2
            - id: comment-service-nested
              uri: http://localhost:8083
              predicates:
                - Path=/api/posts/*/comments/**
              filters:
                - AuthenticationFilter

            #3
            - id: comment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/comments/**
              filters:
                - AuthenticationFilter

            #4
            - id: post-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/posts/**
              filters:
                - AuthenticationFilter