server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1: Auth Service (Không cần filter)
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/users/**

            # 2: Comment Service (Nested - Lấy comment theo bài viết)
            - id: comment-service-nested
              uri: ${COMMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/posts/*/comments/**
              filters:
                - name: AuthenticationFilter

            # 3: Comment Service (Direct)
            - id: comment-service
              uri: ${COMMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/comments/**
              filters:
                - name: AuthenticationFilter

            # 4: Post Service
            - id: post-service
              uri: ${POST_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/posts/**
              filters:
                - name: AuthenticationFilter